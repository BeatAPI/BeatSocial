<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BeatSocial 审核台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Lora:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>try { const t = localStorage.getItem("beatsocial-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand">
      <span class="mark" aria-hidden="true">B</span>
      <span class="brand-text"><b>BeatSocial</b><small>社媒审核台</small></span>
    </div>
    <nav id="tabs">
      <button data-tab="today"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg><span>今天</span><em id="nav-today"></em></button>
      <button data-tab="markets"><svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4z"/><path d="M3 12l9 4 9-4"/><path d="M3 17l9 4 9-4"/></svg><span>市场</span></button>
      <button data-tab="review"><svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg><span>帖子</span><em id="nav-review"></em></button>
      <button data-tab="data"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>数据</span></button>
      <button data-tab="accounts"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span>渠道账号</span></button>
      <button data-tab="competitors"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span>竞对</span></button>
      <button data-tab="rules"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg><span>规则</span><em id="nav-rules"></em></button>
    </nav>
    <div class="side-foot">
      <button id="theme" class="ghost" title="切换浅色 / 深色">
        <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span>切换主题</span>
      </button>
      <div class="who" id="who"></div>
    </div>
  </aside>
  <main>
    <header class="page-head" id="page-head"></header>
    <div id="view"></div>
  </main>
</div>
<div id="drawer" class="drawer hidden"><div class="drawer-body"><button class="close" id="drawer-close" aria-label="关闭">×</button><div id="drawer-content"></div></div></div>
<div id="toast" class="toast hidden"></div>
<script src="app.js"></script>
</body>
</html>
